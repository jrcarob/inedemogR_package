# Weekly and on-demand run of the opt-in live INE integration test
# (tests/testthat/test-live-integration.R). Kept separate from R-CMD-check so
# an INE outage never blocks ordinary development checks.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: live-integration.yaml

permissions: read-all

jobs:
  live-integration:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      INEDEMOGR_LIVE_TESTS: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - name: Live pipeline test
        run: devtools::test(filter = "live-integration", stop_on_failure = TRUE)
        shell: Rscript {0}
